[target.thumbv6m-none-eabi]
runner = "pyocd flash --target mspm0g3507 --format elf"

[build]
target = "thumbv6m-none-eabi"

[alias]
# xtask is host-side tooling (DSO export, bench calibration logging), not
# firmware;
# --target here overrides `build.target` above regardless of invocation
# directory (config-file target settings only apply via directory
# discovery, but a CLI --target flag always wins).
xtask = "run --manifest-path xtask/Cargo.toml --target aarch64-apple-darwin --"
